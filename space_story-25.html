<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مهمة الفضاء الكبرى 🚀</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:radial-gradient(circle at 20% 10%,#263b8f 0,#0a1038 38%,#030516 100%);color:#fff;min-height:100vh}#app{max-width:900px;margin:auto;min-height:100vh;padding:20px}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:48px 48px;opacity:.25}.card{position:relative;background:rgba(10,18,65,.9);border:1px solid #6578d8;border-radius:28px;padding:28px;box-shadow:0 20px 60px #0008;margin:15px 0}.hero{text-align:center;padding:38px 20px}.rocket{font-size:85px;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}h1{font-size:clamp(30px,7vw,58px);margin:10px 0;background:linear-gradient(90deg,#fff,#a9d9ff,#d7b8ff);color:transparent;background-clip:text}h2{font-size:30px;margin-top:0}.sub{font-size:19px;line-height:1.8;color:#dce4ff}.btn{border:0;border-radius:16px;padding:14px 20px;margin:7px;font-size:17px;font-weight:bold;cursor:pointer;background:#fff;color:#121b54;box-shadow:0 7px 0 #8998df}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #8998df}.choice{display:block;width:100%;text-align:right;background:#17266e;color:#fff;border:1px solid #7083e5;box-shadow:none}.choice:hover{background:#273b92}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.fact{background:#111e5b;border-radius:18px;padding:15px;border:1px solid #4c61c1}.progress{height:12px;background:#1a2455;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#62d7ff,#b28cff);width:0;transition:.4s}.score{font-weight:bold;color:#ffe77a}.hidden{display:none}.feedback{min-height:30px;font-weight:bold}.big{font-size:52px;text-align:center}.badge{display:inline-block;padding:10px 14px;border-radius:99px;background:#202e78;margin:5px}.small{font-size:14px;color:#b9c5f5}.launch{height:150px;position:relative;overflow:hidden;background:linear-gradient(#07103d,#13082f);border-radius:20px;margin:20px 0}.ship{position:absolute;bottom:15px;right:45%;font-size:58px;transition:4s}.ship.go{transform:translateY(-180px) rotate(-4deg)}.flame{position:absolute;bottom:-2px;right:calc(45% + 19px);font-size:30px;opacity:0}.flame.go{opacity:1;animation:flicker .2s infinite alternate}@keyframes flicker{to{transform:scale(1.3)}}.planet{font-size:75px;text-align:center}.quiz button.correct{background:#1d7b5b}.quiz button.wrong{background:#8a3150}@media(max-width:500px){#app{padding:10px}.card{padding:20px}.rocket{font-size:65px}}
</style></head><body><div class="stars"></div><main id="app"></main><script>
const app=document.getElementById('app');let score=0,stage=0,selected=false;
const scenes=[
{title:'المهمة تبدأ! 🌍',icon:'🚀',text:'أنتِ الآن قائدة فريق صغير من مستكشفي الفضاء. وصلت رسالة غامضة من مركز التحكم: «لدينا مهمة جديدة! نحتاج إلى معرفة كيف يصل الصاروخ إلى الفضاء، ثم استكشاف الكواكب والعودة بمعلومة مذهلة.»',facts:['🧑‍🚀 رائد الفضاء يرتدي بدلة تحميه وتساعده على التنفس.','📡 مركز التحكم يتابع الرحلة ويرسل التعليمات.','🚀 الصاروخ يحمل المركبة والأجهزة إلى الفضاء.']},
{title:'كيف يستعد الصاروخ؟ 🛠️',icon:'🚀',text:'قبل الإطلاق، يفحص المهندسون الصاروخ وأنظمته، ويتأكدون من الوقود والأجهزة والاتصالات. ثم يصعد الرواد إلى المركبة ويبدأ العد التنازلي.',facts:['1️⃣ فحص الأنظمة','2️⃣ تجهيز الوقود','3️⃣ دخول الرواد','4️⃣ إغلاق الأبواب والعد التنازلي']},
{title:'لحظة الإطلاق! 🔥',icon:'🚀',text:'عند الإطلاق تعمل المحركات بقوة، وتدفع الغازات إلى الأسفل، فيتحرك الصاروخ إلى الأعلى. ومع صعوده تتخلص بعض المراحل من أجزائها عندما تنتهي مهمتها لتصبح المركبة أخف.',launch:true},
{title:'لماذا لا يسقط الصاروخ مباشرة؟ 🌎',icon:'🛰️',text:'الصاروخ يحتاج إلى سرعة كبيرة حتى يصل إلى مسار مناسب حول الأرض. في الفضاء لا يوجد «أعلى» و«أسفل» بالطريقة التي نشعر بها على الأرض، وتتحرك المركبات وفق مسارات تحددها سرعتها والجاذبية.',facts:['🌎 جاذبية الأرض تؤثر في المركبة.','🛰️ الأقمار الصناعية تتحرك في مدارات.','📐 المسار والسرعة يحسبهما العلماء والمهندسون بدقة.']},
{title:'المحطة الفضائية 🛰️',icon:'🧑‍🚀',text:'وصلتم إلى منطقة المدار! ترون محطة فضائية تدور حول الأرض. داخلها يجري رواد الفضاء تجارب علمية ويتعلمون كيف تعمل الأشياء في بيئة مختلفة عن الأرض.',facts:['🔬 تجارب علمية','🌱 دراسة النباتات','🌍 مراقبة الأرض','📷 تصوير الظواهر الطبيعية']},
{title:'المريخ الأحمر 🔴',icon:'🔴',text:'هبطت مركبتكم الآلية على المريخ! سطحه مليء بالصخور والغبار، وتعمل المركبات الجوالة على دراسة الصخور والتربة والبحث عن دلائل تساعد العلماء على فهم تاريخه.',facts:['🔴 لونه مرتبط بوجود مواد غنية بالحديد على سطحه.','🤖 المركبات الجوالة تجمع بيانات وصورًا.','🧊 توجد أدلة على وجود جليد مائي في مناطق من المريخ.']},
{title:'حزام الكويكبات 🪨',icon:'☄️',text:'أمامكم منطقة تحتوي على أجرام صخرية كثيرة. لا يعني ذلك أنها جدار متلاصق؛ توجد مسافات كبيرة بينها، لكن الملاحة تحتاج إلى حسابات دقيقة.',facts:['🪨 الكويكبات أجسام صخرية أو معدنية.','🧭 المركبات تستخدم أنظمة ملاحة وحسابات للمسار.']},
{title:'المشتري العملاق 🟠',icon:'🟠',text:'ظهر المشتري! إنه أكبر كواكب المجموعة الشمسية، وتظهر عليه أحزمة سحابية وعاصفة ضخمة شهيرة. لا توجد أرض صلبة نمشي عليها مثل الأرض.',facts:['🪐 أكبر كواكب المجموعة الشمسية.','🌪️ غلافه الجوي مليء بحركة وعواصف.','🌙 لديه عدد كبير من الأقمار.']},
{title:'حلقات زحل 💫',icon:'🪐',text:'وصلتم إلى زحل، أحد أكثر المشاهد شهرة في النظام الشمسي. حلقاته تتكون أساسًا من قطع صغيرة من الجليد والصخور والغبار تدور حول الكوكب.',facts:['💫 الحلقات ليست سطحًا صلبًا.','🧊 تحتوي على جليد وصخور وغبار.','🌙 لزحل أقمار كثيرة.']},
{title:'العودة إلى الأرض 🌍',icon:'🌍',text:'انتهت المهمة! تجمع الفريق حول شاشة المركز، وسجلتم ما تعلمتموه عن الصواريخ والمدارات والكواكب. الآن حان وقت اختبار رائد الفضاء الحقيقي!',facts:['⭐ اجمعي أكبر عدد من النجوم.','🧠 أجيبي عن الأسئلة.','🏆 احصلي على شارة مستكشفة الفضاء.']}
];
function header(){return `<div class="card"><div class="small">المهمة ${Math.min(stage+1,10)} من 10</div><div class="progress"><div class="bar" style="width:${stage*10}%"></div></div><div class="score">⭐ النقاط: ${score}</div></div>`}
function renderScene(){let s=scenes[stage];app.innerHTML=header()+`<section class="card"><div class="planet">${s.icon}</div><h2>${s.title}</h2><p class="sub">${s.text}</p>${s.facts?`<div class="grid">${s.facts.map(x=>`<div class="fact">${x}</div>`).join('')}</div>`:''}${s.launch?`<div class="launch"><div id="ship" class="ship">🚀</div><div id="flame" class="flame">🔥</div></div><button class="btn" onclick="launch()">🔥 اطلقي الصاروخ!</button><div id="launchmsg" class="feedback"></div>`:''}<div style="text-align:center;margin-top:20px"><button class="btn" onclick="next()">${stage===9?'ابدأ الاختبار 🧠':'تابعي المهمة ➜'}</button></div></section>`}
function launch(){document.getElementById('ship').classList.add('go');document.getElementById('flame').classList.add('go');document.getElementById('launchmsg').textContent='🚀 انطلق الصاروخ! القوة إلى الأسفل تدفع الصاروخ إلى الأعلى.';score+=5;}
function next(){if(stage<9){stage++;renderScene()}else quiz()}
function start(){stage=0;score=0;app.innerHTML=`<section class="card hero"><div class="rocket">🚀</div><h1>مهمة الفضاء الكبرى</h1><p class="sub">رحلة تفاعلية من الأرض إلى الفضاء ثم إلى الكواكب! هل أنتِ مستعدة لتصبحي قائدة المهمة؟</p><div class="badge">🚀 الصواريخ</div><div class="badge">🛰️ الفضاء</div><div class="badge">🪐 الكواكب</div><div class="badge">🧠 أسئلة</div><br><button class="btn" onclick="renderScene()">ابدئي المغامرة 🌟</button></section>`}
const qs=[['ما الذي يدفع الصاروخ إلى الأعلى عند الإطلاق؟',['قوة دفع المحركات','ضوء النجوم','حلقات زحل'],0],['ما الذي تدور حوله الأقمار الصناعية القريبة من الأرض؟',['المريخ فقط','الأرض في مدارات مناسبة','الشمس فقط'],1],['مم تتكون حلقات زحل أساسًا؟',['ماء سائل فقط','جليد وصخور وغبار','سحب من نار'],1],['أي كوكب هو الأكبر في المجموعة الشمسية؟',['الأرض','المريخ','المشتري'],2],['ما وظيفة مركز التحكم؟',['متابعة المهمة والتواصل مع المركبة','صنع النجوم','إيقاف الجاذبية'],0]];
function quiz(){let i=0;function show(){let q=qs[i];app.innerHTML=header()+`<section class="card quiz"><h2>🧠 السؤال ${i+1} من ${qs.length}</h2><p class="sub">${q[0]}</p>${q[1].map((x,j)=>`<button class="btn choice" onclick="answer(${j},${q[2]})">${x}</button>`).join('')}<div id="fb" class="feedback"></div></section>`}window.answer=(j,c)=>{let fb=document.getElementById('fb');if(selected)return;selected=true;if(j===c){score+=10;fb.textContent='⭐ إجابة صحيحة! حصلتِ على 10 نقاط.'}else fb.textContent='💡 ليست الإجابة الصحيحة، لكن لا بأس! التعلم هو الهدف.';setTimeout(()=>{selected=false;i++;if(i<qs.length)show();else finish()},900)};show()}
function finish(){app.innerHTML=`<section class="card hero"><div class="big">🏆🚀🌌</div><h1>اكتملت المهمة!</h1><p class="sub">أحسنتِ يا مستكشفة الفضاء! عرفتِ كيف يستعد الصاروخ وينطلق، وكيف تتحرك المركبات في الفضاء، واستكشفتِ المريخ والمشتري وزحل.</p><h2>⭐ مجموعك: ${score} نقطة</h2><div class="badge">🏅 مستكشفة الفضاء</div><div class="badge">🚀 خبيرة الإطلاق</div><div class="badge">🪐 صديقة الكواكب</div><br><button class="btn" onclick="start()">🔄 أعيدي المغامرة</button></section>`}start();
</script></body></html>
